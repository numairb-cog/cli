<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    color: #e0e0e0;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 4px;
  }

  .score-display {
    font-size: 20px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 1px;
  }

  .high-score-display {
    font-size: 14px;
    color: #6b7280;
    letter-spacing: 0.5px;
  }

  #gameCanvas {
    border-radius: 12px;
    box-shadow:
      0 0 30px rgba(139, 92, 246, 0.15),
      0 0 60px rgba(139, 92, 246, 0.05),
      0 4px 20px rgba(0, 0, 0, 0.4);
    display: block;
  }

  .overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
    pointer-events: none;
  }

  .overlay.active { pointer-events: auto; }

  .overlay-title {
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: -1px;
  }

  .overlay-subtitle {
    font-size: 16px;
    color: #9ca3af;
    margin-top: -8px;
  }

  .overlay-score {
    font-size: 64px;
    font-weight: 800;
    color: #a78bfa;
    line-height: 1;
  }

  .overlay-score-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #6b7280;
    margin-top: -4px;
  }

  .overlay-highscore {
    font-size: 16px;
    color: #6b7280;
  }

  .new-highscore {
    color: #f59e0b;
    font-weight: 600;
    animation: pulse 1s ease-in-out infinite;
  }

  .btn {
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #7c3aed, #6366f1);
    color: white;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
  }

  .btn:active {
    transform: translateY(0);
  }

  .controls-hint {
    font-size: 13px;
    color: #4b5563;
    margin-top: 4px;
  }

  .speed-indicator {
    font-size: 13px;
    color: #6b7280;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .fade-in {
    animation: fadeIn 0.3s ease-out;
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header" id="header" style="visibility: hidden;">
    <div class="score-display">SCORE: <span id="scoreText">0</span></div>
    <div class="speed-indicator">SPEED: <span id="speedText">1</span></div>
    <div class="high-score-display">BEST: <span id="highScoreText">0</span></div>
  </div>
  <div style="position: relative; display: inline-block;">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay active" id="overlay"></div>
  </div>
  <div class="controls-hint" id="controlsHint"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const header = document.getElementById('header');
  const scoreText = document.getElementById('scoreText');
  const highScoreText = document.getElementById('highScoreText');
  const speedText = document.getElementById('speedText');
  const controlsHint = document.getElementById('controlsHint');

  // Grid config
  const CELL = 24;
  const COLS = 25;
  const ROWS = 25;
  const GAP = 1;

  // Colors
  const COLORS = {
    bg: '#13131f',
    grid: '#1a1a2e',
    snakeHead: '#a78bfa',
    snakeBody: '#7c3aed',
    snakeTail: '#4c1d95',
    food: '#f43f5e',
    foodGlow: 'rgba(244, 63, 94, 0.3)',
    eyes: '#13131f',
  };

  // Difficulty
  const BASE_INTERVAL = 130;
  const MIN_INTERVAL = 55;
  const SPEED_STEP = 5;

  // State
  let snake, direction, nextDirection, food, score, highScore, gameLoop, state;
  let animFrame = 0;
  let particles = [];

  // Responsive sizing
  function resize() {
    const maxW = window.innerWidth - 40;
    const maxH = window.innerHeight - 120;
    const idealW = COLS * CELL;
    const idealH = ROWS * CELL;
    const scale = Math.min(1, maxW / idealW, maxH / idealH);
    const w = Math.floor(idealW * scale);
    const h = Math.floor(idealH * scale);
    canvas.width = idealW;
    canvas.height = idealH;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    overlay.style.width = w + 'px';
    overlay.style.height = h + 'px';
    overlay.style.top = canvas.offsetTop + 'px';
    overlay.style.left = canvas.offsetLeft + 'px';
  }

  window.addEventListener('resize', () => { resize(); if (state !== 'playing') draw(); });

  // High score persistence
  function loadHighScore() {
    try { highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0; } catch { highScore = 0; }
  }
  function saveHighScore() {
    try { localStorage.setItem('snakeHighScore', highScore); } catch {}
  }

  // Init game
  function init() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    particles = [];
    scoreText.textContent = '0';
    speedText.textContent = '1';
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occupied.has(pos.x + ',' + pos.y));
    food = pos;
  }

  // Particles
  function emitParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        size: 2 + Math.random() * 3,
        color,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Game speed
  function getInterval() {
    const level = Math.floor(score / SPEED_STEP);
    return Math.max(MIN_INTERVAL, BASE_INTERVAL - level * 8);
  }

  function getSpeedLevel() {
    return Math.floor(score / SPEED_STEP) + 1;
  }

  // Draw
  function draw() {
    animFrame++;

    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid dots
    ctx.fillStyle = COLORS.grid;
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.beginPath();
        ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Food glow
    const glowSize = 12 + Math.sin(animFrame * 0.08) * 4;
    const foodCx = food.x * CELL + CELL / 2;
    const foodCy = food.y * CELL + CELL / 2;
    const grd = ctx.createRadialGradient(foodCx, foodCy, 0, foodCx, foodCy, glowSize * 2);
    grd.addColorStop(0, COLORS.foodGlow);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(foodCx - glowSize * 2, foodCy - glowSize * 2, glowSize * 4, glowSize * 4);

    // Food
    const foodRadius = (CELL / 2 - 3) + Math.sin(animFrame * 0.1) * 1.5;
    ctx.fillStyle = COLORS.food;
    ctx.beginPath();
    ctx.arc(foodCx, foodCy, foodRadius, 0, Math.PI * 2);
    ctx.fill();

    // Snake body
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = i / Math.max(1, len - 1);
      const r = CELL / 2 - GAP - (i === 0 ? 0 : 1 + t * 2);

      // Gradient color along body
      const ratio = i / Math.max(1, len - 1);
      const color = lerpColor(COLORS.snakeHead, COLORS.snakeTail, ratio);

      const cx = seg.x * CELL + CELL / 2;
      const cy = seg.y * CELL + CELL / 2;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + GAP, seg.y * CELL + GAP, CELL - GAP * 2, CELL - GAP * 2, r * 0.6);
      ctx.fill();

      // Head details
      if (i === 0) {
        // Eyes
        const eyeOffsetX = direction.x * 3;
        const eyeOffsetY = direction.y * 3;
        const eyeSpreadX = direction.y !== 0 ? 4 : 0;
        const eyeSpreadY = direction.x !== 0 ? 4 : 0;

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx + eyeOffsetX - eyeSpreadX, cy + eyeOffsetY - eyeSpreadY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + eyeOffsetX + eyeSpreadX, cy + eyeOffsetY + eyeSpreadY, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.eyes;
        ctx.beginPath();
        ctx.arc(cx + eyeOffsetX * 1.3 - eyeSpreadX, cy + eyeOffsetY * 1.3 - eyeSpreadY, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + eyeOffsetX * 1.3 + eyeSpreadX, cy + eyeOffsetY * 1.3 + eyeSpreadY, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Particles on top
    drawParticles();
  }

  function lerpColor(a, b, t) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
    const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
    const rr = Math.round(ar + (br - ar) * t);
    const rg = Math.round(ag + (bg - ag) * t);
    const rb = Math.round(ab + (bb - ab) * t);
    return `rgb(${rr},${rg},${rb})`;
  }

  // Game tick
  function tick() {
    direction = { ...nextDirection };

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    // Self collision
    for (const seg of snake) {
      if (seg.x === head.x && seg.y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreText.textContent = score;
      speedText.textContent = getSpeedLevel();
      emitParticles(food.x, food.y, COLORS.food, 12);
      spawnFood();

      // Restart loop with new speed
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, getInterval());
    } else {
      snake.pop();
    }

    draw();
    updateParticles();
  }

  // Game over
  function gameOver() {
    clearInterval(gameLoop);
    state = 'over';

    // Death particles
    for (const seg of snake) {
      emitParticles(seg.x, seg.y, COLORS.snakeBody, 3);
    }
    draw();

    const isNewHigh = score > highScore;
    if (isNewHigh) {
      highScore = score;
      saveHighScore();
    }
    highScoreText.textContent = highScore;

    overlay.className = 'overlay active fade-in';
    overlay.innerHTML = `
      <div class="overlay-title">Game Over</div>
      <div class="overlay-score">${score}</div>
      <div class="overlay-score-label">points</div>
      ${isNewHigh ? '<div class="new-highscore">New High Score!</div>' : `<div class="overlay-highscore">Best: ${highScore}</div>`}
      <button class="btn" onclick="window._startGame()">Play Again</button>
      <div class="controls-hint">or press Space / Enter</div>
    `;
  }

  // Start
  function showStartScreen() {
    state = 'start';
    loadHighScore();
    highScoreText.textContent = highScore;
    init();
    resize();
    draw();

    header.style.visibility = 'hidden';
    controlsHint.textContent = '';

    overlay.className = 'overlay active fade-in';
    overlay.innerHTML = `
      <div class="overlay-title">Snake</div>
      <div class="overlay-subtitle">A classic reimagined</div>
      <button class="btn" onclick="window._startGame()">Start Game</button>
      <div class="controls-hint">Arrow keys or WASD to move</div>
      ${highScore > 0 ? `<div class="overlay-highscore">High Score: ${highScore}</div>` : ''}
    `;
  }

  window._startGame = function () {
    init();
    resize();
    state = 'playing';
    header.style.visibility = 'visible';
    controlsHint.textContent = 'Arrow keys or WASD to move';
    overlay.className = 'overlay';
    overlay.innerHTML = '';
    draw();
    gameLoop = setInterval(tick, getInterval());
  };

  // Input
  document.addEventListener('keydown', (e) => {
    if (state !== 'playing') {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        window._startGame();
      }
      return;
    }

    const key = e.key.toLowerCase();
    const map = {
      arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 },
    };

    const dir = map[key] || map[e.key];
    if (dir) {
      e.preventDefault();
      // Prevent reversing
      if (dir.x !== -direction.x || dir.y !== -direction.y) {
        nextDirection = dir;
      }
    }
  });

  // Touch controls
  let touchStartX, touchStartY;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (state !== 'playing') { window._startGame(); return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

    let dir;
    if (Math.abs(dx) > Math.abs(dy)) {
      dir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
      dir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    if (dir.x !== -direction.x || dir.y !== -direction.y) {
      nextDirection = dir;
    }
  });

  // Continuous rendering for particles & food animation
  function renderLoop() {
    if (state === 'playing') {
      // tick handles main draw, but we update particles between ticks
    } else {
      draw();
      updateParticles();
    }
    requestAnimationFrame(renderLoop);
  }

  showStartScreen();
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
