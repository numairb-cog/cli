<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  display: block;
  image-rendering: pixelated;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  display: flex;
  justify-content: center;
  align-items: center;
}
#start-screen, #game-over-screen {
  pointer-events: all;
  text-align: center;
  color: #fff;
}
#start-screen h1 {
  font-size: 48px;
  color: #0ff;
  text-shadow: 0 0 20px #0ff, 0 0 40px #08f;
  margin-bottom: 20px;
}
#start-screen p, #game-over-screen p {
  font-size: 16px;
  color: #aaa;
  margin: 8px 0;
}
#game-over-screen h2 {
  font-size: 36px;
  color: #f44;
  text-shadow: 0 0 20px #f44;
  margin-bottom: 10px;
}
#game-over-screen .score-display {
  font-size: 24px;
  color: #ff0;
  margin: 10px 0;
}
.btn {
  pointer-events: all;
  background: none;
  border: 2px solid #0ff;
  color: #0ff;
  padding: 12px 32px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s;
}
.btn:hover {
  background: #0ff;
  color: #000;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-overlay">
  <div id="start-screen">
    <h1>SPACE SHOOTER</h1>
    <p>Arrow Keys / WASD - Move</p>
    <p>Space - Shoot</p>
    <p>F - Toggle Auto-fire</p>
    <p>P - Pause</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
  <div id="game-over-screen" style="display:none;">
    <h2>GAME OVER</h2>
    <p class="score-display">Score: <span id="final-score">0</span></p>
    <p>Wave: <span id="final-wave">1</span></p>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>
<script>
'use strict';

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

// Scale canvas to fit window
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// AUDIO ENGINE (Procedural Chiptune)
// ============================================================
let audioCtx = null;
let masterGain = null;
let musicPlaying = false;
let musicInterval = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

function playTone(freq, duration, type, vol, dest) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(dest || masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol) {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  src.buffer = buffer;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  src.connect(gain);
  gain.connect(masterGain);
  src.start();
}

// Sound effects
function sfxShoot() { playTone(880, 0.08, 'square', 0.06); }
function sfxExplosion() { playNoise(0.3, 0.15); playTone(80, 0.3, 'sawtooth', 0.08); }
function sfxBigExplosion() { playNoise(0.6, 0.25); playTone(50, 0.5, 'sawtooth', 0.12); playTone(30, 0.6, 'triangle', 0.1); }
function sfxPowerUp() { playTone(523, 0.1, 'square', 0.08); setTimeout(() => playTone(659, 0.1, 'square', 0.08), 80); setTimeout(() => playTone(784, 0.15, 'square', 0.08), 160); }
function sfxBomb() { playNoise(1.0, 0.3); playTone(40, 1.0, 'sawtooth', 0.15); }
function sfxHit() { playNoise(0.1, 0.12); playTone(200, 0.15, 'square', 0.06); }
function sfxBossWarning() { for (let i = 0; i < 3; i++) setTimeout(() => playTone(220, 0.2, 'square', 0.1), i * 300); }

// Procedural chiptune music
const BASS_NOTES = [65, 73, 82, 65, 87, 98, 82, 73];
const MELODY_NOTES = [
  [262, 330, 392, 330], [294, 349, 440, 349],
  [262, 330, 523, 440], [294, 392, 494, 392],
  [349, 440, 523, 440], [330, 392, 494, 392],
  [294, 349, 440, 349], [262, 330, 392, 523]
];
let musicStep = 0;

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  musicStep = 0;
  musicInterval = setInterval(() => {
    if (!audioCtx || game.state !== 'playing') return;
    const bassIdx = Math.floor(musicStep / 4) % BASS_NOTES.length;
    playTone(BASS_NOTES[bassIdx], 0.15, 'triangle', 0.04);
    const melodyBar = Math.floor(musicStep / 4) % MELODY_NOTES.length;
    const melodyNote = MELODY_NOTES[melodyBar][musicStep % 4];
    if (musicStep % 2 === 0) {
      playTone(melodyNote, 0.12, 'square', 0.025);
    }
    // Arp accent
    if (musicStep % 8 === 0) {
      playTone(melodyNote * 2, 0.06, 'square', 0.02);
    }
    musicStep++;
  }, 150);
}

function stopMusic() {
  musicPlaying = false;
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
}

// ============================================================
// INPUT HANDLING
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyF' && game.state === 'playing') game.autoFire = !game.autoFire;
  if (e.code === 'KeyP' && (game.state === 'playing' || game.state === 'paused')) {
    game.state = game.state === 'paused' ? 'playing' : 'paused';
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ============================================================
// OBJECT POOLS
// ============================================================
class Pool {
  constructor(factory, initialSize) {
    this.factory = factory;
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) this.pool.push(factory());
  }
  get() {
    const obj = this.pool.length > 0 ? this.pool.pop() : this.factory();
    obj.active = true;
    this.active.push(obj);
    return obj;
  }
  release(obj) {
    obj.active = false;
    const idx = this.active.indexOf(obj);
    if (idx >= 0) this.active.splice(idx, 1);
    this.pool.push(obj);
  }
  releaseAll() {
    while (this.active.length > 0) {
      const obj = this.active.pop();
      obj.active = false;
      this.pool.push(obj);
    }
  }
  forEach(fn) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      fn(this.active[i], i);
    }
  }
}

// ============================================================
// STARFIELD (Parallax Layers)
// ============================================================
class Starfield {
  constructor() {
    this.layers = [
      { stars: [], speed: 0.5, size: 1, count: 80, color: '#334' },
      { stars: [], speed: 1.2, size: 1.5, count: 50, color: '#667' },
      { stars: [], speed: 2.5, size: 2, count: 30, color: '#aab' }
    ];
    for (const layer of this.layers) {
      for (let i = 0; i < layer.count; i++) {
        layer.stars.push({ x: Math.random() * W, y: Math.random() * H });
      }
    }
  }
  update(dt) {
    for (const layer of this.layers) {
      for (const star of layer.stars) {
        star.y += layer.speed * 60 * dt;
        if (star.y > H) { star.y = -2; star.x = Math.random() * W; }
      }
    }
  }
  draw() {
    for (const layer of this.layers) {
      ctx.fillStyle = layer.color;
      for (const star of layer.stars) {
        ctx.fillRect(star.x, star.y, layer.size, layer.size);
      }
    }
  }
}

// ============================================================
// PARTICLES
// ============================================================
const particlePool = new Pool(() => ({
  x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, size: 2,
  r: 255, g: 200, b: 50, active: false
}), 500);

function spawnParticles(x, y, count, opts = {}) {
  for (let i = 0; i < count; i++) {
    const p = particlePool.get();
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 120) * (0.3 + Math.random() * 0.7);
    p.x = x; p.y = y;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.life = opts.life || (0.3 + Math.random() * 0.5);
    p.maxLife = p.life;
    p.size = opts.size || (1 + Math.random() * 3);
    p.r = opts.r ?? 255; p.g = opts.g ?? (150 + Math.random() * 105 | 0); p.b = opts.b ?? 0;
  }
}

function spawnExplosion(x, y, big) {
  spawnParticles(x, y, big ? 60 : 25, {
    speed: big ? 200 : 120,
    r: 255, g: 180, b: 30,
    life: big ? 0.8 : 0.4,
    size: big ? 4 : 2
  });
  // Inner white flash
  spawnParticles(x, y, big ? 15 : 8, {
    speed: big ? 80 : 50,
    r: 255, g: 255, b: 255,
    life: 0.15, size: big ? 3 : 2
  });
  if (big) sfxBigExplosion(); else sfxExplosion();
  if (big) game.screenShake = 0.4;
  else game.screenShake = Math.max(game.screenShake, 0.1);
}

function updateParticles(dt) {
  particlePool.forEach((p) => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particlePool.release(p);
  });
}

function drawParticles() {
  particlePool.forEach((p) => {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

// ============================================================
// PLAYER
// ============================================================
const player = {
  x: W / 2, y: H - 80,
  w: 24, h: 28,
  speed: 280,
  baseSpeed: 280,
  lives: 3,
  weaponLevel: 0, // 0=single, 1=double, 2=triple, 3=spread
  shield: false,
  speedBoost: false,
  speedBoostTimer: 0,
  invincible: false,
  invincibleTimer: 0,
  shootCooldown: 0,
  shootRate: 0.12,
  bombFlash: 0,

  reset() {
    this.x = W / 2; this.y = H - 80;
    this.lives = 3; this.weaponLevel = 0;
    this.shield = false; this.speedBoost = false;
    this.speedBoostTimer = 0; this.invincible = false;
    this.invincibleTimer = 0; this.shootCooldown = 0;
    this.bombFlash = 0; this.speed = this.baseSpeed;
  },

  update(dt) {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
    if (keys['ArrowDown'] || keys['KeyS']) dy = 1;
    // Normalize diagonal
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    const spd = this.speedBoost ? this.speed * 1.5 : this.speed;
    this.x += dx * spd * dt;
    this.y += dy * spd * dt;
    // Clamp
    this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x));
    this.y = Math.max(this.h / 2, Math.min(H - this.h / 2, this.y));

    // Shooting
    this.shootCooldown -= dt;
    if ((keys['Space'] || game.autoFire) && this.shootCooldown <= 0) {
      this.shoot();
      this.shootCooldown = this.shootRate;
    }

    // Timers
    if (this.speedBoost) {
      this.speedBoostTimer -= dt;
      if (this.speedBoostTimer <= 0) this.speedBoost = false;
    }
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }
    if (this.bombFlash > 0) this.bombFlash -= dt;

    // Engine particles
    if (Math.random() < 0.5) {
      spawnParticles(this.x, this.y + this.h / 2, 1, {
        speed: 40, r: 100, g: 150, b: 255, life: 0.2, size: 2
      });
    }
  },

  shoot() {
    sfxShoot();
    const bx = this.x, by = this.y - this.h / 2;
    switch (this.weaponLevel) {
      case 0: // Single
        spawnBullet(bx, by, 0, -600, true);
        break;
      case 1: // Double
        spawnBullet(bx - 8, by, 0, -600, true);
        spawnBullet(bx + 8, by, 0, -600, true);
        break;
      case 2: // Triple
        spawnBullet(bx - 10, by, 0, -600, true);
        spawnBullet(bx, by - 5, 0, -650, true);
        spawnBullet(bx + 10, by, 0, -600, true);
        break;
      case 3: // Spread
        spawnBullet(bx, by - 5, 0, -650, true);
        spawnBullet(bx - 8, by, -60, -600, true);
        spawnBullet(bx + 8, by, 60, -600, true);
        spawnBullet(bx - 14, by + 3, -120, -550, true);
        spawnBullet(bx + 14, by + 3, 120, -550, true);
        break;
    }
  },

  takeDamage() {
    if (this.invincible) return;
    if (this.shield) {
      this.shield = false;
      this.invincible = true;
      this.invincibleTimer = 0.5;
      sfxHit();
      spawnParticles(this.x, this.y, 15, { speed: 100, r: 80, g: 180, b: 255, life: 0.3 });
      return;
    }
    this.lives--;
    this.invincible = true;
    this.invincibleTimer = 2.0;
    this.weaponLevel = Math.max(0, this.weaponLevel - 1);
    sfxBigExplosion();
    spawnExplosion(this.x, this.y, false);
    if (this.lives <= 0) {
      game.state = 'gameover';
      stopMusic();
      document.getElementById('game-over-screen').style.display = 'block';
      document.getElementById('final-score').textContent = game.score;
      document.getElementById('final-wave').textContent = game.wave;
    }
  },

  draw() {
    if (this.invincible && Math.floor(this.invincibleTimer * 10) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    // Ship body
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);
    ctx.lineTo(-this.w / 2, this.h / 2);
    ctx.lineTo(-this.w / 4, this.h / 3);
    ctx.lineTo(0, this.h / 2.5);
    ctx.lineTo(this.w / 4, this.h / 3);
    ctx.lineTo(this.w / 2, this.h / 2);
    ctx.closePath();
    ctx.fill();
    // Cockpit
    ctx.fillStyle = '#8df';
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 3);
    ctx.lineTo(-5, this.h / 8);
    ctx.lineTo(5, this.h / 8);
    ctx.closePath();
    ctx.fill();
    // Wings detail
    ctx.fillStyle = '#38c';
    ctx.fillRect(-this.w / 2 - 2, this.h / 4, 6, 4);
    ctx.fillRect(this.w / 2 - 4, this.h / 4, 6, 4);
    // Shield glow
    if (this.shield) {
      ctx.strokeStyle = 'rgba(80,200,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(80,200,255,0.2)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.restore();
  }
};

// ============================================================
// BULLETS
// ============================================================
const bulletPool = new Pool(() => ({
  x: 0, y: 0, vx: 0, vy: 0, w: 4, h: 10,
  isPlayer: true, active: false, damage: 1
}), 200);

function spawnBullet(x, y, vx, vy, isPlayer, damage) {
  const b = bulletPool.get();
  b.x = x; b.y = y; b.vx = vx; b.vy = vy;
  b.isPlayer = isPlayer;
  b.damage = damage || 1;
  b.w = isPlayer ? 3 : 5;
  b.h = isPlayer ? 10 : 8;
  return b;
}

function updateBullets(dt) {
  bulletPool.forEach((b) => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
      bulletPool.release(b);
    }
  });
}

function drawBullets() {
  bulletPool.forEach((b) => {
    if (b.isPlayer) {
      ctx.fillStyle = '#5f5';
      ctx.shadowColor = '#5f5';
      ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = '#f55';
      ctx.shadowColor = '#f55';
      ctx.shadowBlur = 6;
    }
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  });
  ctx.shadowBlur = 0;
}

// ============================================================
// ENEMIES
// ============================================================
const enemyPool = new Pool(() => ({
  x: 0, y: 0, w: 24, h: 24, vx: 0, vy: 0,
  hp: 1, maxHp: 1, type: 'basic', active: false,
  shootTimer: 0, shootRate: 2,
  pattern: null, patternTimer: 0,
  color: '#f80', scoreValue: 100,
  amplitude: 0, frequency: 0, baseX: 0, // for zigzag
  diveTarget: null, divePhase: 0 // for dive bomber
}), 100);

function spawnEnemy(type, x, y, opts = {}) {
  const e = enemyPool.get();
  e.x = x; e.y = y;
  e.type = type;
  e.patternTimer = 0;
  e.shootTimer = Math.random() * 2;
  e.diveTarget = null;
  e.divePhase = 0;

  switch (type) {
    case 'basic':
      e.hp = e.maxHp = 1 + Math.floor(game.wave / 4);
      e.vx = opts.vx || 0; e.vy = opts.vy || 100 + game.wave * 5;
      e.w = 22; e.h = 22; e.color = '#f80';
      e.scoreValue = 100; e.shootRate = 2.5 - Math.min(game.wave * 0.1, 1.5);
      break;
    case 'zigzag':
      e.hp = e.maxHp = 2 + Math.floor(game.wave / 3);
      e.vy = opts.vy || 80 + game.wave * 3;
      e.vx = 0;
      e.amplitude = opts.amplitude || 100;
      e.frequency = opts.frequency || 2;
      e.baseX = x;
      e.w = 20; e.h = 24; e.color = '#f0f';
      e.scoreValue = 200; e.shootRate = 2;
      break;
    case 'divebomber':
      e.hp = e.maxHp = 2 + Math.floor(game.wave / 3);
      e.vx = 0; e.vy = 60;
      e.w = 26; e.h = 20; e.color = '#ff0';
      e.scoreValue = 250; e.shootRate = 3;
      e.divePhase = 0;
      break;
    case 'formation':
      e.hp = e.maxHp = 1 + Math.floor(game.wave / 5);
      e.vx = opts.vx || 0; e.vy = opts.vy || 70;
      e.w = 18; e.h = 18; e.color = '#0f8';
      e.scoreValue = 150; e.shootRate = 3;
      break;
  }
  return e;
}

function updateEnemies(dt) {
  enemyPool.forEach((e) => {
    e.patternTimer += dt;
    switch (e.type) {
      case 'basic':
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        break;
      case 'zigzag':
        e.y += e.vy * dt;
        e.x = e.baseX + Math.sin(e.patternTimer * e.frequency * Math.PI * 2) * e.amplitude;
        break;
      case 'divebomber':
        if (e.divePhase === 0) {
          e.y += e.vy * dt;
          if (e.y > 100 + Math.random() * 100) {
            e.divePhase = 1;
            // Aim at player
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const speed = 250 + game.wave * 10;
            e.vx = (dx / dist) * speed;
            e.vy = (dy / dist) * speed;
          }
        } else {
          e.x += e.vx * dt;
          e.y += e.vy * dt;
        }
        break;
      case 'formation':
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.x < 30 || e.x > W - 30) e.vx *= -1;
        break;
    }

    // Shooting
    e.shootTimer -= dt;
    if (e.shootTimer <= 0 && e.y > 0 && e.y < H - 50) {
      e.shootTimer = e.shootRate * (0.7 + Math.random() * 0.6);
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const speed = 200 + game.wave * 8;
      spawnBullet(e.x, e.y + e.h / 2, (dx / dist) * speed, (dy / dist) * speed, false);
    }

    // Remove if offscreen
    if (e.y > H + 50 || e.y < -100 || e.x < -100 || e.x > W + 100) {
      enemyPool.release(e);
      game.comboTimer = 0;
      game.comboCount = 0;
    }
  });
}

function drawEnemies() {
  enemyPool.forEach((e) => {
    ctx.save();
    ctx.translate(e.x, e.y);

    // Draw based on type
    ctx.fillStyle = e.color;
    switch (e.type) {
      case 'basic':
        // Inverted triangle ship
        ctx.beginPath();
        ctx.moveTo(0, e.h / 2);
        ctx.lineTo(-e.w / 2, -e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#a50';
        ctx.fillRect(-3, -e.h / 4, 6, 6);
        break;
      case 'zigzag':
        // Diamond shape
        ctx.beginPath();
        ctx.moveTo(0, -e.h / 2);
        ctx.lineTo(e.w / 2, 0);
        ctx.lineTo(0, e.h / 2);
        ctx.lineTo(-e.w / 2, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#a0a';
        ctx.fillRect(-3, -3, 6, 6);
        break;
      case 'divebomber':
        // Arrow shape
        ctx.beginPath();
        ctx.moveTo(0, e.h / 2);
        ctx.lineTo(-e.w / 2, -e.h / 3);
        ctx.lineTo(-e.w / 4, -e.h / 2);
        ctx.lineTo(0, -e.h / 3);
        ctx.lineTo(e.w / 4, -e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#aa0';
        ctx.fillRect(-2, -2, 4, 6);
        break;
      case 'formation':
        // Small hexagon
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i - Math.PI / 2;
          const px = Math.cos(angle) * e.w / 2;
          const py = Math.sin(angle) * e.h / 2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#0a5';
        ctx.fillRect(-2, -2, 4, 4);
        break;
    }

    // HP bar for tougher enemies
    if (e.maxHp > 1) {
      const barW = e.w + 4;
      ctx.fillStyle = '#400';
      ctx.fillRect(-barW / 2, -e.h / 2 - 6, barW, 3);
      ctx.fillStyle = '#f44';
      ctx.fillRect(-barW / 2, -e.h / 2 - 6, barW * (e.hp / e.maxHp), 3);
    }

    ctx.restore();
  });
}

// ============================================================
// BOSS
// ============================================================
const boss = {
  active: false,
  x: W / 2, y: -80,
  w: 80, h: 60,
  hp: 100, maxHp: 100,
  phase: 0,
  phaseTimer: 0,
  shootTimer: 0,
  moveAngle: 0,
  entering: true,
  defeated: false,

  spawn(wave) {
    this.active = true;
    this.entering = true;
    this.defeated = false;
    this.x = W / 2; this.y = -80;
    this.phase = 0; this.phaseTimer = 0;
    this.shootTimer = 0; this.moveAngle = 0;
    this.maxHp = 80 + wave * 40;
    this.hp = this.maxHp;
    this.w = 80 + Math.min(wave, 10) * 2;
    sfxBossWarning();
  },

  update(dt) {
    if (!this.active) return;

    // Entry
    if (this.entering) {
      this.y += 60 * dt;
      if (this.y >= 80) { this.y = 80; this.entering = false; }
      return;
    }

    this.phaseTimer += dt;
    this.moveAngle += dt;

    // Movement pattern
    const cx = W / 2 + Math.sin(this.moveAngle * 0.8) * 150;
    const cy = 80 + Math.sin(this.moveAngle * 0.5) * 30;
    this.x += (cx - this.x) * 2 * dt;
    this.y += (cy - this.y) * 2 * dt;

    // Phase changes
    if (this.phaseTimer > 4) {
      this.phase = (this.phase + 1) % 3;
      this.phaseTimer = 0;
    }

    // Attack patterns
    this.shootTimer -= dt;
    if (this.shootTimer <= 0) {
      switch (this.phase) {
        case 0: // Spread burst
          for (let i = -3; i <= 3; i++) {
            const angle = Math.PI / 2 + i * 0.2;
            spawnBullet(this.x, this.y + this.h / 2,
              Math.cos(angle) * 250, Math.sin(angle) * 250, false);
          }
          this.shootTimer = 0.5;
          break;
        case 1: // Aimed shots
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          for (let i = -1; i <= 1; i++) {
            spawnBullet(this.x + i * 20, this.y + this.h / 2,
              (dx / dist) * 300, (dy / dist) * 300, false);
          }
          this.shootTimer = 0.4;
          break;
        case 2: // Spiral
          const sAngle = this.phaseTimer * 5;
          for (let i = 0; i < 2; i++) {
            const a = sAngle + i * Math.PI;
            spawnBullet(this.x, this.y,
              Math.cos(a) * 200, Math.sin(a) * 200, false);
          }
          this.shootTimer = 0.12;
          break;
      }
    }
  },

  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.defeated = true;
      this.active = false;
      // Big explosion
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          if (game.state !== 'playing') return;
          spawnExplosion(
            this.x + (Math.random() - 0.5) * this.w,
            this.y + (Math.random() - 0.5) * this.h,
            true
          );
        }, i * 150);
      }
      game.screenShake = 1.0;
      game.addScore(5000);
      game.waveTimer = 3;
      game.bossActive = false;
    }
  },

  draw() {
    if (!this.active) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Main body
    ctx.fillStyle = '#a22';
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);
    ctx.lineTo(this.w / 2, 0);
    ctx.lineTo(this.w / 3, this.h / 2);
    ctx.lineTo(-this.w / 3, this.h / 2);
    ctx.lineTo(-this.w / 2, 0);
    ctx.closePath();
    ctx.fill();

    // Wings
    ctx.fillStyle = '#c33';
    ctx.beginPath();
    ctx.moveTo(-this.w / 3, -this.h / 4);
    ctx.lineTo(-this.w / 2 - 15, this.h / 4);
    ctx.lineTo(-this.w / 3, this.h / 3);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(this.w / 3, -this.h / 4);
    ctx.lineTo(this.w / 2 + 15, this.h / 4);
    ctx.lineTo(this.w / 3, this.h / 3);
    ctx.closePath();
    ctx.fill();

    // Core
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#faa';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // Damage glow
    if (this.hp < this.maxHp * 0.3) {
      ctx.fillStyle = `rgba(255,${Math.random() * 100 | 0},0,0.3)`;
      ctx.beginPath();
      ctx.arc(
        (Math.random() - 0.5) * this.w * 0.5,
        (Math.random() - 0.5) * this.h * 0.5,
        5 + Math.random() * 10, 0, Math.PI * 2
      );
      ctx.fill();
    }

    ctx.restore();
  }
};

// ============================================================
// POWER-UPS
// ============================================================
const powerUpPool = new Pool(() => ({
  x: 0, y: 0, w: 18, h: 18, vy: 80, type: 'weapon',
  active: false, timer: 0
}), 20);

const PU_TYPES = ['weapon', 'shield', 'speed', 'bomb'];
const PU_COLORS = { weapon: '#5f5', shield: '#5af', speed: '#ff5', bomb: '#f55' };
const PU_LABELS = { weapon: 'W', shield: 'S', speed: 'SPD', bomb: 'B' };

function spawnPowerUp(x, y) {
  const p = powerUpPool.get();
  p.x = x; p.y = y;
  p.type = PU_TYPES[Math.random() * PU_TYPES.length | 0];
  p.timer = 0;
  return p;
}

function updatePowerUps(dt) {
  powerUpPool.forEach((p) => {
    p.y += p.vy * dt;
    p.timer += dt;
    if (p.y > H + 20) powerUpPool.release(p);
  });
}

function drawPowerUps() {
  powerUpPool.forEach((p) => {
    const glow = 0.5 + Math.sin(p.timer * 5) * 0.3;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = PU_COLORS[p.type];
    ctx.globalAlpha = 0.3 + glow * 0.4;
    ctx.fillRect(-12, -12, 24, 24);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = PU_COLORS[p.type];
    ctx.lineWidth = 2;
    ctx.strokeRect(-10, -10, 20, 20);
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_LABELS[p.type], 0, 0);
    ctx.restore();
  });
}

function collectPowerUp(type) {
  sfxPowerUp();
  switch (type) {
    case 'weapon':
      player.weaponLevel = Math.min(3, player.weaponLevel + 1);
      break;
    case 'shield':
      player.shield = true;
      break;
    case 'speed':
      player.speedBoost = true;
      player.speedBoostTimer = 5;
      break;
    case 'bomb':
      player.bombFlash = 0.3;
      sfxBomb();
      game.screenShake = 0.5;
      // Destroy all enemies
      enemyPool.forEach((e) => {
        spawnExplosion(e.x, e.y, false);
        game.addScore(e.scoreValue);
        enemyPool.release(e);
      });
      // Clear enemy bullets
      bulletPool.forEach((b) => {
        if (!b.isPlayer) bulletPool.release(b);
      });
      // Damage boss
      if (boss.active) boss.takeDamage(20);
      break;
  }
}

// ============================================================
// COLLISION DETECTION
// ============================================================
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2 &&
         ax + aw / 2 > bx - bw / 2 &&
         ay - ah / 2 < by + bh / 2 &&
         ay + ah / 2 > by - bh / 2;
}

function checkCollisions() {
  // Player bullets vs enemies
  bulletPool.forEach((b) => {
    if (!b.isPlayer) return;
    enemyPool.forEach((e) => {
      if (rectOverlap(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
        e.hp -= b.damage;
        bulletPool.release(b);
        spawnParticles(b.x, b.y, 3, { speed: 60, r: 100, g: 255, b: 100, life: 0.15, size: 2 });
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, false);
          game.addScore(e.scoreValue);
          game.addCombo();
          // Power-up drop
          if (Math.random() < 0.15) spawnPowerUp(e.x, e.y);
          enemyPool.release(e);
        }
      }
    });
    // Player bullets vs boss
    if (boss.active && !boss.entering &&
        rectOverlap(b.x, b.y, b.w, b.h, boss.x, boss.y, boss.w, boss.h)) {
      boss.takeDamage(b.damage);
      bulletPool.release(b);
      spawnParticles(b.x, b.y, 3, { speed: 60, r: 255, g: 100, b: 100, life: 0.15, size: 2 });
    }
  });

  // Enemy bullets vs player
  if (!player.invincible) {
    bulletPool.forEach((b) => {
      if (b.isPlayer) return;
      if (rectOverlap(b.x, b.y, b.w, b.h, player.x, player.y, player.w * 0.6, player.h * 0.6)) {
        bulletPool.release(b);
        player.takeDamage();
      }
    });
  }

  // Enemies vs player
  if (!player.invincible) {
    enemyPool.forEach((e) => {
      if (rectOverlap(e.x, e.y, e.w * 0.7, e.h * 0.7, player.x, player.y, player.w * 0.6, player.h * 0.6)) {
        spawnExplosion(e.x, e.y, false);
        e.hp = 0;
        enemyPool.release(e);
        player.takeDamage();
      }
    });
  }

  // Boss vs player
  if (boss.active && !player.invincible && !boss.entering) {
    if (rectOverlap(boss.x, boss.y, boss.w * 0.7, boss.h * 0.7, player.x, player.y, player.w * 0.6, player.h * 0.6)) {
      player.takeDamage();
    }
  }

  // Power-ups vs player
  powerUpPool.forEach((p) => {
    if (rectOverlap(p.x, p.y, p.w, p.h, player.x, player.y, player.w + 10, player.h + 10)) {
      collectPowerUp(p.type);
      powerUpPool.release(p);
    }
  });
}

// ============================================================
// WAVE SYSTEM
// ============================================================
function spawnWaveEnemies() {
  const wave = game.wave;
  game.enemiesRemaining = 0;

  // Boss wave every 5 waves
  if (wave % 5 === 0) {
    game.bossActive = true;
    boss.spawn(wave);
    return;
  }

  // Mix of enemy types based on wave
  const patterns = [];

  // Basic fighters every wave
  const basicCount = 4 + Math.min(wave, 10);
  for (let i = 0; i < basicCount; i++) {
    patterns.push({ type: 'basic', delay: i * 0.4, x: 40 + Math.random() * (W - 80), y: -30 });
  }

  // Zigzag from wave 2+
  if (wave >= 2) {
    const zigCount = 2 + Math.floor(wave / 2);
    for (let i = 0; i < zigCount; i++) {
      patterns.push({ type: 'zigzag', delay: basicCount * 0.4 + i * 0.6, x: W / 2, y: -30 });
    }
  }

  // Dive bombers from wave 3+
  if (wave >= 3) {
    const diveCount = 1 + Math.floor(wave / 3);
    for (let i = 0; i < diveCount; i++) {
      patterns.push({ type: 'divebomber', delay: 1 + i * 1.0, x: 60 + Math.random() * (W - 120), y: -30 });
    }
  }

  // Formations from wave 4+
  if (wave >= 4) {
    const formSize = 3 + Math.floor(wave / 4);
    const startX = W / 2 - (formSize * 30) / 2;
    for (let i = 0; i < formSize; i++) {
      patterns.push({
        type: 'formation', delay: 2 + i * 0.15,
        x: startX + i * 30, y: -30,
        opts: { vx: 50 + wave * 5 }
      });
    }
  }

  game.spawnQueue = patterns;
  game.spawnTimer = 0;
  game.enemiesRemaining = patterns.length;
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  // Score
  ctx.fillStyle = '#fff';
  ctx.font = '16px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${game.score}`, 10, 24);

  // Combo multiplier
  if (game.comboMultiplier > 1) {
    ctx.fillStyle = '#ff0';
    ctx.fillText(`x${game.comboMultiplier}`, 10, 44);
    // Combo timer bar
    const barW = 50 * (game.comboTimer / 3);
    ctx.fillStyle = 'rgba(255,255,0,0.5)';
    ctx.fillRect(50, 37, barW, 6);
  }

  // Wave
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${game.wave}`, W / 2, 24);

  // Lives
  ctx.textAlign = 'right';
  for (let i = 0; i < player.lives; i++) {
    const lx = W - 15 - i * 22;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.moveTo(lx, 10);
    ctx.lineTo(lx - 7, 22);
    ctx.lineTo(lx + 7, 22);
    ctx.closePath();
    ctx.fill();
  }

  // Weapon level
  ctx.fillStyle = '#5f5';
  ctx.textAlign = 'right';
  const wpnNames = ['SINGLE', 'DOUBLE', 'TRIPLE', 'SPREAD'];
  ctx.fillText(wpnNames[player.weaponLevel], W - 10, 40);

  // Auto-fire indicator
  if (game.autoFire) {
    ctx.fillStyle = '#ff0';
    ctx.fillText('AUTO', W - 10, 56);
  }

  // Shield indicator
  if (player.shield) {
    ctx.fillStyle = '#5af';
    ctx.textAlign = 'left';
    ctx.fillText('SHIELD', 10, 60);
  }

  // Speed boost indicator
  if (player.speedBoost) {
    ctx.fillStyle = '#ff5';
    ctx.textAlign = 'left';
    ctx.fillText(`SPEED ${player.speedBoostTimer.toFixed(1)}s`, 10, player.shield ? 76 : 60);
  }

  // Boss health bar
  if (boss.active && !boss.entering) {
    const barY = 50;
    const barW = W - 100;
    const barH = 8;
    const barX = 50;
    // Background
    ctx.fillStyle = '#400';
    ctx.fillRect(barX, barY, barW, barH);
    // Health
    const hpRatio = boss.hp / boss.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? '#f44' : hpRatio > 0.25 ? '#f80' : '#ff0';
    ctx.fillRect(barX, barY, barW * hpRatio, barH);
    // Border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('BOSS', W / 2, barY - 3);
  }

  // Wave announcement
  if (game.waveAnnounceTimer > 0) {
    const alpha = Math.min(1, game.waveAnnounceTimer * 2);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = '28px Courier New';
    ctx.textAlign = 'center';
    if (game.bossActive) {
      ctx.fillStyle = '#f44';
      ctx.fillText('WARNING: BOSS INCOMING', W / 2, H / 2 - 20);
    } else {
      ctx.fillText(`WAVE ${game.wave}`, W / 2, H / 2 - 20);
    }
    ctx.globalAlpha = 1;
  }

  // Bomb flash
  if (player.bombFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${player.bombFlash})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Pause screen
  if (game.state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '32px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '14px Courier New';
    ctx.fillText('Press P to resume', W / 2, H / 2 + 30);
  }
}

// ============================================================
// GAME STATE
// ============================================================
const game = {
  state: 'menu', // menu, playing, paused, gameover
  score: 0,
  wave: 0,
  waveTimer: 0,
  waveAnnounceTimer: 0,
  autoFire: false,
  screenShake: 0,
  spawnQueue: [],
  spawnTimer: 0,
  enemiesRemaining: 0,
  bossActive: false,
  comboCount: 0,
  comboTimer: 0,
  comboMultiplier: 1,

  reset() {
    this.score = 0;
    this.wave = 0;
    this.waveTimer = 2;
    this.waveAnnounceTimer = 0;
    this.autoFire = false;
    this.screenShake = 0;
    this.spawnQueue = [];
    this.spawnTimer = 0;
    this.enemiesRemaining = 0;
    this.bossActive = false;
    this.comboCount = 0;
    this.comboTimer = 0;
    this.comboMultiplier = 1;
    bulletPool.releaseAll();
    enemyPool.releaseAll();
    particlePool.releaseAll();
    powerUpPool.releaseAll();
    boss.active = false;
    player.reset();
  },

  addScore(base) {
    this.score += base * this.comboMultiplier;
  },

  addCombo() {
    this.comboCount++;
    this.comboTimer = 3;
    if (this.comboCount >= 10) this.comboMultiplier = 4;
    else if (this.comboCount >= 5) this.comboMultiplier = 3;
    else if (this.comboCount >= 3) this.comboMultiplier = 2;
    else this.comboMultiplier = 1;
  },

  nextWave() {
    this.wave++;
    this.waveAnnounceTimer = 2;
    spawnWaveEnemies();
  }
};

// ============================================================
// MAIN GAME LOOP
// ============================================================
const starfield = new Starfield();
let lastTime = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (game.state === 'menu' || game.state === 'gameover') {
    // Still animate starfield on menu
    starfield.update(dt);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    starfield.draw();
    return;
  }

  if (game.state === 'paused') {
    // Draw everything but don't update
    draw();
    return;
  }

  // UPDATE
  update(dt);

  // DRAW
  draw();
}

function update(dt) {
  starfield.update(dt);
  player.update(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateParticles(dt);
  updatePowerUps(dt);
  boss.update(dt);
  checkCollisions();

  // Combo timer
  if (game.comboTimer > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) {
      game.comboCount = 0;
      game.comboMultiplier = 1;
    }
  }

  // Wave management
  game.waveAnnounceTimer -= dt;
  if (game.screenShake > 0) game.screenShake -= dt;

  // Spawn queue
  if (game.spawnQueue.length > 0) {
    game.spawnTimer += dt;
    while (game.spawnQueue.length > 0 && game.spawnQueue[0].delay <= game.spawnTimer) {
      const s = game.spawnQueue.shift();
      spawnEnemy(s.type, s.x, s.y, s.opts || {});
    }
  }

  // Check wave clear
  if (!game.bossActive && game.spawnQueue.length === 0 && enemyPool.active.length === 0 && game.wave > 0) {
    game.waveTimer -= dt;
    if (game.waveTimer <= 0) {
      game.waveTimer = 2;
      game.nextWave();
    }
  }

  // Start first wave
  if (game.wave === 0) {
    game.waveTimer -= dt;
    if (game.waveTimer <= 0) {
      game.nextWave();
    }
  }
}

function draw() {
  ctx.save();

  // Screen shake
  if (game.screenShake > 0) {
    const intensity = game.screenShake * 8;
    ctx.translate(
      (Math.random() - 0.5) * intensity,
      (Math.random() - 0.5) * intensity
    );
  }

  // Clear
  ctx.fillStyle = '#000';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  starfield.draw();
  drawPowerUps();
  drawBullets();
  drawEnemies();
  boss.draw();
  player.draw();
  drawParticles();
  drawHUD();

  ctx.restore();
}

// ============================================================
// UI EVENT HANDLERS
// ============================================================
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  game.reset();
  game.state = 'playing';
  document.getElementById('start-screen').style.display = 'none';
  startMusic();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  initAudio();
  game.reset();
  game.state = 'playing';
  document.getElementById('game-over-screen').style.display = 'none';
  startMusic();
});

// Start rendering
requestAnimationFrame(gameLoop);
