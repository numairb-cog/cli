<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: 100vw;
    padding: 10px;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    padding: 0 4px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #hud .score { color: #0ff; text-shadow: 0 0 8px #0ff; }
  #hud .high-score { color: #f0f; text-shadow: 0 0 8px #f0f; }

  canvas {
    border: 2px solid #1a1a3a;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.08), inset 0 0 30px rgba(0, 0, 0, 0.5);
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5, 5, 20, 0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
    padding: 20px;
    text-align: center;
    transition: opacity 0.3s;
  }

  .overlay.hidden { display: none; }

  .overlay h1 {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 800;
    background: linear-gradient(135deg, #0ff, #f0f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
    text-shadow: none;
  }

  .overlay p {
    font-size: clamp(13px, 3vw, 16px);
    color: #8888bb;
    line-height: 1.7;
    max-width: 380px;
    margin-bottom: 8px;
  }

  .overlay .final-score {
    font-size: clamp(40px, 10vw, 64px);
    font-weight: 800;
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px rgba(0, 255, 255, 0.4);
    margin: 10px 0 4px;
  }

  .overlay .label {
    font-size: 13px;
    color: #6666aa;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 2px;
  }

  .overlay .high-score-display {
    font-size: 18px;
    color: #f0f;
    text-shadow: 0 0 10px #f0f;
    margin-bottom: 20px;
  }

  .btn {
    background: linear-gradient(135deg, #0ff, #0af);
    color: #0a0a1a;
    border: none;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    margin-top: 16px;
  }

  .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
  .btn:active { transform: scale(0.97); }

  .keys-hint {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #aaaadd;
  }

  /* Mobile d-pad */
  #dpad {
    display: none;
    width: 160px;
    height: 160px;
    position: relative;
    margin-top: 8px;
    flex-shrink: 0;
  }

  .dpad-btn {
    position: absolute;
    width: 52px; height: 52px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #8888cc;
    cursor: pointer;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .dpad-btn:active, .dpad-btn.active {
    background: rgba(0, 255, 255, 0.15);
    border-color: #0ff;
    color: #0ff;
  }

  .dpad-up    { top: 0;   left: 50%; transform: translateX(-50%); }
  .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
  .dpad-left  { left: 0;  top: 50%;  transform: translateY(-50%); }
  .dpad-right { right: 0; top: 50%;  transform: translateY(-50%); }

  @media (hover: none) and (pointer: coarse) {
    #dpad { display: block; }
  }

  /* New high score animation */
  @keyframes newHighPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.08); }
  }
  .new-high { animation: newHighPulse 0.8s ease-in-out infinite; color: #ff0 !important; text-shadow: 0 0 15px #ff0 !important; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <span class="score">SCORE: <span id="score-display">0</span></span>
    <span class="high-score">BEST: <span id="high-display">0</span></span>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="dpad">
    <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
    <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
    <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
    <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
  </div>
</div>

<!-- Start Screen -->
<div class="overlay" id="start-screen">
  <h1>NEON SNAKE</h1>
  <p>Eat glowing food to grow.<br>Don't hit the walls or yourself!</p>
  <div class="keys-hint">
    <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
    <span style="color:#6666aa;display:flex;align-items:center;margin:0 6px;">or</span>
    <span class="key">&#8593;</span><span class="key">&#8592;</span><span class="key">&#8595;</span><span class="key">&#8594;</span>
  </div>
  <p style="font-size:12px;color:#5555aa;">On mobile, use the on-screen d-pad</p>
  <button class="btn" id="start-btn">PLAY</button>
</div>

<!-- Game Over Screen -->
<div class="overlay hidden" id="gameover-screen">
  <h1>GAME OVER</h1>
  <div class="label">YOUR SCORE</div>
  <div class="final-score" id="final-score">0</div>
  <div class="high-score-display" id="final-high">BEST: 0</div>
  <button class="btn" id="restart-btn">PLAY AGAIN</button>
</div>

<script>
(function () {
  'use strict';

  /* ─── Constants ─── */
  const GRID       = 20;
  const COLS       = 25;
  const ROWS       = 25;
  const WIDTH       = COLS * GRID;
  const HEIGHT      = ROWS * GRID;
  const BASE_SPEED  = 130;   // ms per tick at start
  const MIN_SPEED   = 55;    // fastest tick
  const SPEED_DECAY = 1.5;   // ms removed per food eaten

  /* ─── Canvas Setup ─── */
  const canvas = document.getElementById('game-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = WIDTH;
  canvas.height = HEIGHT;

  /* ─── Audio (Web Audio API) ─── */
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(freq, duration, type, vol) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function sfxEat() {
    playTone(660, 0.08, 'square', 0.13);
    setTimeout(() => playTone(880, 0.10, 'square', 0.10), 50);
  }

  function sfxDie() {
    playTone(220, 0.25, 'sawtooth', 0.15);
    setTimeout(() => playTone(110, 0.35, 'sawtooth', 0.12), 120);
  }

  /* ─── Particles ─── */
  const particles = [];

  function spawnParticles(x, y, color) {
    const count = 14 + (Math.random() * 8) | 0;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3.5;
      particles.push({
        x: x + GRID / 2,
        y: y + GRID / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        size: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ─── Game State ─── */
  let snake, dir, nextDir, food, score, highScore, alive, tickInterval, lastTick, foodAge;

  function loadHigh() {
    try { return parseInt(localStorage.getItem('neonSnakeHigh')) || 0; } catch { return 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem('neonSnakeHigh', v); } catch { /* noop */ }
  }

  highScore = loadHigh();
  document.getElementById('high-display').textContent = highScore;

  function resetGame() {
    const cx = (COLS / 2) | 0;
    const cy = (ROWS / 2) | 0;
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    tickInterval = BASE_SPEED;
    lastTick = 0;
    foodAge = 0;
    particles.length = 0;
    placeFood();
    updateScoreUI();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let attempts = 0;
    do {
      food = {
        x: (Math.random() * COLS) | 0,
        y: (Math.random() * ROWS) | 0
      };
      attempts++;
    } while (occupied.has(food.x + ',' + food.y) && attempts < 1000);
    foodAge = 0;
  }

  function updateScoreUI() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('high-display').textContent = highScore;
  }

  /* ─── Direction Helpers ─── */
  const DIRS = {
    up:    { x:  0, y: -1 },
    down:  { x:  0, y:  1 },
    left:  { x: -1, y:  0 },
    right: { x:  1, y:  0 }
  };

  function setDirection(name) {
    const d = DIRS[name];
    if (!d) return;
    // Prevent 180° reversal
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  /* ─── Input ─── */
  const KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
  };

  document.addEventListener('keydown', (e) => {
    const mapped = KEY_MAP[e.key];
    if (mapped) {
      e.preventDefault();
      if (!alive) return;
      setDirection(mapped);
    }
  });

  /* D-pad (mobile) */
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const handler = (e) => {
      e.preventDefault();
      if (!alive) return;
      setDirection(btn.dataset.dir);
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 120);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  /* ─── Game Logic Tick ─── */
  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      die();
      return;
    }

    // Self collision
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        die();
        return;
      }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score++;
      sfxEat();
      spawnParticles(food.x * GRID, food.y * GRID, '#0f0');
      if (score > highScore) {
        highScore = score;
        saveHigh(highScore);
      }
      updateScoreUI();
      // Increase speed
      tickInterval = Math.max(MIN_SPEED, BASE_SPEED - score * SPEED_DECAY);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    sfxDie();
    // Spawn particles along entire snake
    for (const seg of snake) {
      if (Math.random() < 0.5) {
        spawnParticles(seg.x * GRID, seg.y * GRID, '#f44');
      }
    }
    setTimeout(showGameOver, 600);
  }

  /* ─── Rendering ─── */
  function hslString(h, s, l, a) {
    return `hsla(${h},${s}%,${l}%,${a || 1})`;
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, HEIGHT); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(WIDTH, y * GRID); ctx.stroke();
    }
  }

  function drawSnake() {
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = len > 1 ? i / (len - 1) : 0;

      // Gradient: head=cyan(180°), tail=magenta(300°)
      const hue = 180 + t * 120;
      const lightness = 55 - t * 15;
      const glow = i === 0 ? 18 : 8 - t * 6;

      const px = seg.x * GRID;
      const py = seg.y * GRID;
      const inset = 1;

      ctx.save();
      ctx.shadowColor = hslString(hue, 100, 60);
      ctx.shadowBlur = glow;
      ctx.fillStyle = hslString(hue, 90, lightness);
      ctx.beginPath();
      ctx.roundRect(px + inset, py + inset, GRID - inset * 2, GRID - inset * 2, 4);
      ctx.fill();

      // Bright inner highlight
      ctx.fillStyle = hslString(hue, 100, 80, 0.25);
      ctx.beginPath();
      ctx.roundRect(px + inset + 2, py + inset + 2, GRID - inset * 2 - 4, (GRID - inset * 2) / 2 - 2, 3);
      ctx.fill();
      ctx.restore();

      // Eyes on head
      if (i === 0) {
        const eyeR = 2.5;
        const eyeOffX = dir.x === 0 ? 5 : (dir.x > 0 ? 12 : 6);
        const eyeOffY = dir.y === 0 ? 6 : (dir.y > 0 ? 12 : 5);
        const eyeOffX2 = dir.x === 0 ? GRID - 7 : eyeOffX;
        const eyeOffY2 = dir.y === 0 ? GRID - 8 : eyeOffY;

        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(px + eyeOffX, py + eyeOffY, eyeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + eyeOffX2, py + eyeOffY2, eyeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawFood(time) {
    foodAge += 16;
    const pulse = 0.8 + 0.2 * Math.sin(foodAge * 0.005);
    const glowPulse = 12 + 8 * Math.sin(foodAge * 0.004);
    const px = food.x * GRID;
    const py = food.y * GRID;
    const cx = px + GRID / 2;
    const cy = py + GRID / 2;
    const r = (GRID / 2 - 2) * pulse;

    ctx.save();
    // Outer glow
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = glowPulse;
    ctx.fillStyle = '#0f0';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(200, 255, 200, 0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy - 1, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ─── Main Loop ─── */
  let running = false;
  let animFrame = 0;

  function gameLoop(timestamp) {
    if (!running) return;
    animFrame = requestAnimationFrame(gameLoop);

    if (alive) {
      if (timestamp - lastTick >= tickInterval) {
        tick();
        lastTick = timestamp;
      }
    }

    // Clear
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    drawGrid();

    if (alive) {
      drawFood(timestamp);
      drawSnake();
    }

    updateParticles();
    drawParticles();
  }

  /* ─── Screen Transitions ─── */
  const startScreen    = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const startBtn       = document.getElementById('start-btn');
  const restartBtn     = document.getElementById('restart-btn');

  function startGame() {
    ensureAudio();
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    resetGame();
    running = true;
    lastTick = performance.now();
    animFrame = requestAnimationFrame(gameLoop);
  }

  function showGameOver() {
    document.getElementById('final-score').textContent = score;
    const highEl = document.getElementById('final-high');
    if (score >= highScore && score > 0) {
      highEl.textContent = 'NEW BEST: ' + highScore;
      highEl.classList.add('new-high');
    } else {
      highEl.textContent = 'BEST: ' + highScore;
      highEl.classList.remove('new-high');
    }
    gameoverScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      if (!startScreen.classList.contains('hidden')) {
        e.preventDefault();
        startGame();
      } else if (!gameoverScreen.classList.contains('hidden')) {
        e.preventDefault();
        startGame();
      }
    }
  });

  /* ─── Initial Draw ─── */
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  drawGrid();
})();
</script>
</body>
</html>
